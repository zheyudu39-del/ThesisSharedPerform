# 生产部署（单机 Docker Compose）。
#
# 与 docker-compose.yml 的区别：
#   - 只有 nginx 对外暴露端口，其余服务仅在内部网络可达；
#   - 增加 api / web / ws 三个自建镜像；
#   - 增加一次性 migrate 服务，up 时自动执行数据库迁移；
#   - 所有密钥从 .env 读取，不使用任何默认值。
#
# 用法（在仓库根目录）：
#   cp infra/docker/.env.prod.example .env.prod   # 然后填写
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.prod up -d --build

name: thesis-shared

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    container_name: thesis-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 未设置}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 未设置}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  # SeaweedFS 的 S3 端口必须能让**浏览器**直连（预签名直传），
  # 因此由 nginx 单独转发一个 /s3/ 路径，见 nginx.conf。
  s3:
    <<: *restart
    image: chrislusf/seaweedfs:4.54
    container_name: thesis-s3
    # -volumeSizeLimitMB 必须显式设小。
    # 默认单卷 1GB，SeaweedFS 用「剩余磁盘 ÷ 单卷大小」算可建卷数；
    # 小盘服务器上算出来只有个位数，而且这些卷会被建在默认集合里，
    # 导致 thesis-files 集合分不到可写卷，表现为上传 500
    # （日志：No writable volumes and no free volumes left）。
    command: >
      server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -master.port=9333 -filer.port=8888
      -volumeSizeLimitMB=256
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY 未设置}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY 未设置}
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 20

  # 一次性任务：执行 goose 迁移后退出。api 通过 depends_on 等它成功。
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      args:
        VERSION: ${VERSION:-prod}
    image: thesis-shared/api:latest
    container_name: thesis-migrate
    entrypoint: ["/app/goose"]
    command:
      ["-dir", "/app/db/migrations", "up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *restart
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      args:
        VERSION: ${VERSION:-prod}
    image: thesis-shared/api:latest
    container_name: thesis-api
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_ADDR: ":8080"
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # 两条端点各司其职：
      #   S3_ENDPOINT        服务端自己读写，走容器内网，不经过 nginx；
      #   S3_PUBLIC_ENDPOINT 生成预签名 URL 用，必须浏览器可达。
      # 若只配一条，浏览器会拿到 s3:8333 这种解析不了的 host。
      S3_ENDPOINT: s3:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT 未设置}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-thesis-files}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置}
      # 浏览器直连协同服务，必须是对外可达的 wss://
      WS_PUBLIC_URL: ${WS_PUBLIC_URL:?WS_PUBLIC_URL 未设置}
      WS_INTERNAL_URL: http://ws:1235
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_started

  ws:
    <<: *restart
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ws
    image: thesis-shared/ws:latest
    container_name: thesis-ws
    environment:
      APP_ENV: ${APP_ENV:-production}
      WS_PORT: "1234"
      WS_HEALTH_PORT: "1235"
      WS_ADDRESS: 0.0.0.0
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      # 协同服务只读写快照，不生成预签名 URL，用内网地址即可。
      S3_ENDPOINT: s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-thesis-files}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_started

  web:
    <<: *restart
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        # 浏览器走同源相对路径，由 nginx 统一转发，因此留空。
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL 未设置}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL 未设置}
        # 构建期写进 rewrites：容器内部直连 api 服务。
        API_INTERNAL_URL: http://api:8080
    image: thesis-shared/web:latest
    container_name: thesis-web
    depends_on:
      api:
        condition: service_started

  nginx:
    <<: *restart
    image: nginx:1.27-alpine
    container_name: thesis-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
      - ws
      - s3

volumes:
  pgdata:
  s3data:

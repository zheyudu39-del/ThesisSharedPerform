services:
  postgres:
    image: postgres:16-alpine
    container_name: thesis-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thesis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thesis_dev}
      POSTGRES_DB: ${POSTGRES_DB:-thesis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thesis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: thesis-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 兼容对象存储。
  # 原计划使用 MinIO，但其 Docker Hub 仓库已限制匿名拉取（pull access denied），
  # 因此改用 SeaweedFS —— 同样提供 S3 API，且 minio-go SDK 可直接对接。
  # 注意 -ip.bind=0.0.0.0：SeaweedFS 默认只绑 127.0.0.1，容器内回环会导致端口映射失效。
  s3:
    image: chrislusf/seaweedfs:latest
    container_name: thesis-s3
    command: >
      server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -master.port=9333 -filer.port=8888
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${S3_PORT:-8333}:8333"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - s3data:/data

volumes:
  pgdata:
  redisdata:
  s3data:

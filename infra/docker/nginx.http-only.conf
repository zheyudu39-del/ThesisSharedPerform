# 首次部署用：只开 HTTP，供 certbot 完成域名验证。
#
# 用法：把 docker-compose.prod.yml 里的 nginx 挂载从 nginx.https.conf
# 换成这个文件，up -d，跑完 certbot 后再换回 https 版本。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream web_upstream { server web:3000; }
upstream api_upstream { server api:8080; }
upstream ws_upstream  { server ws:1234; }
upstream s3_upstream  { server s3:8333; }

server {
    listen 80;
    server_name comingidea.com www.comingidea.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余路由先按 HTTP 提供，方便验证阶段直接测试。
    # 注意：这里不能再有第二个 location /，nginx 会报
    # duplicate location "/" 并拒绝启动。
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /thesis-files/ {
        proxy_pass http://s3_upstream;
        proxy_set_header Host $http_host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /collab {
        proxy_pass http://ws_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# 单机反向代理：只暴露 80，其余服务都走容器内网。
#
# 路由分工：
#   /api/            → Go API
#   /thesis-files/   → SeaweedFS S3（浏览器预签名直传 / 下载）
#   /collab          → 协同服务 WebSocket（Hocuspocus）
#   /                → Next.js
#
# 换成 HTTPS 时把 listen 改成 443 + 证书即可，其余不变。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream web_upstream { server web:3000; }
upstream api_upstream { server api:8080; }
upstream ws_upstream  { server ws:1234; }
upstream s3_upstream  { server s3:8333; }

server {
    listen 80;
    server_name _;

    # 论文 PDF 与 Office 文档可能几十 MB。
    client_max_body_size 100m;

    # 大文件不先落盘，直接流式转发。
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- Go API ----
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_read_timeout 120s;
    }

    # ---- 对象存储 ----
    #
    # 预签名 URL 的签名覆盖 path 与 host，nginx 必须**原样**转发：
    # 不改 path、不改查询串，否则 S3 校验签名失败（403）。
    # 桶名固定为 thesis-files，因此用桶名前缀精确匹配，不会误吞页面请求。
    location /thesis-files/ {
        proxy_pass http://s3_upstream;
        # 关键：这里必须保留**含端口**的原始 Host。
        # 上面 server 级设置的 `proxy_set_header Host $host` 用的是 $host
        # （不含端口，8088 会被丢掉），而预签名 URL 的签名是按
        # "152.136.255.253:8088" 计算的；端口一丢，SeaweedFS 校验
        # SigV4 签名不匹配，直接 403 SignatureDoesNotMatch，上传/下载全挂。
        # $http_host 是完整原始 Host 头，含端口。
        proxy_set_header Host $http_host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 协同编辑 WebSocket ----
    # Hocuspocus 接受任意路径的升级请求，文档名走协议层而非 URL。
    location /collab {
        proxy_pass http://ws_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 协同连接是长连接，读写超时都要放宽。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Next.js ----
    location / {
        proxy_pass http://web_upstream;
        proxy_read_timeout 60s;
    }
}

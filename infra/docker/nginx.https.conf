# 生产反向代理：HTTP + HTTPS。
#
# 证书由 certbot 申请，挂载到 /etc/letsencrypt。
# 首次部署时 HTTPS 段会因证书不存在而启动失败——先用 http-only.conf，
# 拿到证书后再换回本文件（见 docs/deployment.md 第 7 节）。
#
# 路由分工：
#   /api/            → Go API
#   /thesis-files/   → SeaweedFS S3（浏览器预签名直传 / 下载）
#   /collab          → 协同服务 WebSocket（Hocuspocus）
#   /                → Next.js

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream web_upstream { server web:3000; }
upstream api_upstream { server api:8080; }
upstream ws_upstream  { server ws:1234; }
upstream s3_upstream  { server s3:8333; }

# ---------------------------------------------------------------------------
# HTTP：只用于 ACME 验证与跳转 HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name comingidea.com www.comingidea.com;

    # certbot 的 webroot 验证路径必须放行，否则续期失败。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name comingidea.com www.comingidea.com;

    ssl_certificate     /etc/letsencrypt/live/comingidea.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comingidea.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    # 会话缓存：减少重复握手，长连接场景收益明显。
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 论文 PDF 与 Office 文档可能几十 MB。
    client_max_body_size 100m;

    # 大文件不先落盘，直接流式转发。
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- Go API ----
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_read_timeout 120s;
    }

    # ---- 对象存储 ----
    #
    # 预签名 URL 的签名覆盖 path 与 host，nginx 必须**原样**转发。
    # 必须用 $http_host（含端口）：用 $host 会丢掉端口，
    # 签名按 "domain:443" 算而校验按 "domain" 算，必然 403。
    location /thesis-files/ {
        proxy_pass http://s3_upstream;
        proxy_set_header Host $http_host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 协同编辑 WebSocket ----
    location /collab {
        proxy_pass http://ws_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Next.js ----
    location / {
        proxy_pass http://web_upstream;
        proxy_read_timeout 60s;
    }
}
